<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習ログ | mstng-lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    padding: 32px 16px 80px;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  header p {
    color: #7d8590;
    font-size: 13px;
  }

  .stats {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }

  .stat-card {
    flex: 1;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 14px 10px;
    text-align: center;
  }

  .stat-card .num {
    font-size: 22px;
    font-weight: 700;
    color: #58a6ff;
  }

  .stat-card .label {
    font-size: 11px;
    color: #7d8590;
    margin-top: 2px;
  }

  form {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 24px;
  }

  form label {
    display: block;
    font-size: 12px;
    color: #7d8590;
    margin-bottom: 6px;
  }

  .field {
    margin-bottom: 14px;
  }

  textarea, select {
    width: 100%;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }

  textarea { min-height: 70px; }

  textarea:focus, select:focus {
    outline: none;
    border-color: #58a6ff;
  }

  .categories {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .cat-btn {
    background: #0d1117;
    border: 1px solid #30363d;
    color: #7d8590;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: 0.15s;
  }

  .cat-btn.active {
    border-color: #58a6ff;
    color: #58a6ff;
    background: rgba(88, 166, 255, 0.1);
  }

  button[type="submit"] {
    width: 100%;
    background: #238636;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
  }

  button[type="submit"]:hover { background: #2ea043; }

  .comment-box {
    display: none;
    margin-top: 14px;
    padding: 12px 14px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-left: 3px solid #58a6ff;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
  }

  .comment-box.show { display: block; }

  .comment-box .who {
    font-weight: 700;
    color: #58a6ff;
    margin-right: 4px;
  }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    overflow-x: auto;
  }

  .log-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .log-entry {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 14px 16px;
  }

  .log-entry .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .log-entry .tag {
    font-size: 11px;
    color: #58a6ff;
    background: rgba(88, 166, 255, 0.1);
    border-radius: 20px;
    padding: 2px 10px;
  }

  .log-entry .date {
    font-size: 11px;
    color: #7d8590;
  }

  .log-entry .text {
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    margin-bottom: 8px;
  }

  .log-entry .reaction {
    font-size: 12.5px;
    color: #7d8590;
    border-top: 1px dashed #30363d;
    padding-top: 8px;
  }

  .log-entry .reaction .who {
    color: #a5a5ff;
    font-weight: 600;
  }

  .log-entry .del {
    background: none;
    border: none;
    color: #7d8590;
    cursor: pointer;
    font-size: 13px;
  }

  .log-entry .del:hover { color: #f85149; }

  .empty {
    text-align: center;
    color: #7d8590;
    font-size: 13px;
    padding: 40px 0;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 11px;
    color: #7d8590;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📓 今日の学習ログ</h1>
      <p>AIチーム（ハル・リク・リン）と一緒に振り返る</p>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="num" id="statTotal">0</div>
        <div class="label">合計記録</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statStreak">0</div>
        <div class="label">連続日数</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statToday">0</div>
        <div class="label">今日の記録</div>
      </div>
    </div>

    <form id="logForm">
      <div class="field">
        <label>今日学んだこと・やったこと</label>
        <textarea id="logText" placeholder="例）Claude Codeでサブエージェントの使い方を試した" required></textarea>
      </div>
      <div class="field">
        <label>カテゴリ</label>
        <div class="categories" id="categoryPicker">
          <button type="button" class="cat-btn active" data-cat="Python">🐍 Python</button>
          <button type="button" class="cat-btn" data-cat="Node.js">🟩 Node.js</button>
          <button type="button" class="cat-btn" data-cat="Shell">🐚 Shell</button>
          <button type="button" class="cat-btn" data-cat="Claude Code">🤖 Claude Code</button>
          <button type="button" class="cat-btn" data-cat="その他">📌 その他</button>
        </div>
      </div>
      <button type="submit">記録する</button>
      <div class="comment-box" id="commentBox"></div>
    </form>

    <div class="filters" id="filters"></div>

    <div class="log-list" id="logList"></div>

    <footer>Powered by localStorage · mstng-lab / webapp</footer>
  </div>

<script>
(() => {
  const STORAGE_KEY = "mstng-lab-learning-log";
  const CATEGORIES = ["すべて", "Python", "Node.js", "Shell", "Claude Code", "その他"];

  const REACTIONS = {
    haru: {
      name: "ハル",
      lines: [
        "おつかれさま！ちゃんと記録できてえらい。この調子で積み上げていこう📋",
        "今日のタスク完了、しっかりログに残せたね。明日の計画も立てておこうか。",
        "継続は力なり。今日も一歩前進だね、進捗管理は任せて！",
        "いいペースだよ。次に何をやるか、軽くメモしておくと後で楽になるよ。"
      ]
    },
    riku: {
      name: "リク",
      lines: [
        "お、その学び方いいね。関連して個人開発のネタになりそう💡",
        "コード書いたなら後でレビューさせて。改善点あるかもしれない。",
        "その調子で手を動かし続けよう。小さくてもアウトプットは正義。",
        "面白い視点だね、それをネタにQiita記事書いてみる？"
      ]
    },
    rin: {
      name: "リン",
      lines: [
        "メモしておくね📝 後でまとめて学習ノート化しよう。",
        "いいインプットだね！忘れないうちに要点を書き出しておこう。",
        "今日の学びも積み上がったね。振り返りが力になるよ。",
        "その内容、次回の復習リストに入れておくね。"
      ]
    }
  };

  const CAT_ICON = {
    "Python": "🐍", "Node.js": "🟩", "Shell": "🐚", "Claude Code": "🤖", "その他": "📌"
  };

  const form = document.getElementById("logForm");
  const textEl = document.getElementById("logText");
  const catPicker = document.getElementById("categoryPicker");
  const commentBox = document.getElementById("commentBox");
  const logList = document.getElementById("logList");
  const filtersEl = document.getElementById("filters");
  const statTotal = document.getElementById("statTotal");
  const statStreak = document.getElementById("statStreak");
  const statToday = document.getElementById("statToday");

  let selectedCategory = "Python";
  let activeFilter = "すべて";

  function loadLogs() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveLogs(logs) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
  }

  function pickReaction() {
    const keys = Object.keys(REACTIONS);
    const who = REACTIONS[keys[Math.floor(Math.random() * keys.length)]];
    const line = who.lines[Math.floor(Math.random() * who.lines.length)];
    return { name: who.name, line };
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }

  function isSameDay(a, b) {
    return a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate();
  }

  function computeStreak(logs) {
    if (logs.length === 0) return 0;
    const days = [...new Set(logs.map(l => {
      const d = new Date(l.createdAt);
      return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    }))];
    const dayDates = days.map(k => {
      const [y, m, d] = k.split("-").map(Number);
      return new Date(y, m, d);
    }).sort((a, b) => b - a);

    let streak = 0;
    let cursor = new Date();
    cursor.setHours(0, 0, 0, 0);

    for (const day of dayDates) {
      if (isSameDay(day, cursor)) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      } else if (day < cursor) {
        break;
      }
    }
    return streak;
  }

  function renderFilters() {
    filtersEl.innerHTML = "";
    CATEGORIES.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "cat-btn" + (cat === activeFilter ? " active" : "");
      btn.textContent = cat === "すべて" ? "すべて" : `${CAT_ICON[cat] || ""} ${cat}`;
      btn.addEventListener("click", () => {
        activeFilter = cat;
        renderFilters();
        renderLogs();
      });
      filtersEl.appendChild(btn);
    });
  }

  function renderStats(logs) {
    statTotal.textContent = logs.length;
    statStreak.textContent = computeStreak(logs);
    const today = new Date();
    statToday.textContent = logs.filter(l => isSameDay(new Date(l.createdAt), today)).length;
  }

  function renderLogs() {
    const logs = loadLogs().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    renderStats(logs);

    const filtered = activeFilter === "すべて" ? logs : logs.filter(l => l.category === activeFilter);

    logList.innerHTML = "";
    if (filtered.length === 0) {
      logList.innerHTML = `<div class="empty">まだ記録がありません。最初の学びを記録してみよう✨</div>`;
      return;
    }

    filtered.forEach(log => {
      const entry = document.createElement("div");
      entry.className = "log-entry";
      entry.innerHTML = `
        <div class="meta">
          <span class="tag">${CAT_ICON[log.category] || ""} ${log.category}</span>
          <span class="date">${formatDate(log.createdAt)}</span>
        </div>
        <div class="text"></div>
        <div class="reaction"><span class="who">${log.reaction.name}:</span> <span class="reaction-line"></span></div>
        <div style="text-align:right; margin-top:8px;">
          <button class="del" data-id="${log.id}">削除</button>
        </div>
      `;
      entry.querySelector(".text").textContent = log.text;
      entry.querySelector(".reaction-line").textContent = log.reaction.line;
      logList.appendChild(entry);
    });

    logList.querySelectorAll(".del").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-id");
        const remaining = loadLogs().filter(l => l.id !== id);
        saveLogs(remaining);
        renderLogs();
      });
    });
  }

  catPicker.querySelectorAll(".cat-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      catPicker.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedCategory = btn.getAttribute("data-cat");
    });
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = textEl.value.trim();
    if (!text) return;

    const reaction = pickReaction();
    const log = {
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
      text,
      category: selectedCategory,
      createdAt: new Date().toISOString(),
      reaction
    };

    const logs = loadLogs();
    logs.push(log);
    saveLogs(logs);

    commentBox.innerHTML = `<span class="who">${reaction.name}:</span>${reaction.line}`;
    commentBox.classList.add("show");

    textEl.value = "";
    renderLogs();
  });

  renderFilters();
  renderLogs();
})();
</script>
</body>
</html>
