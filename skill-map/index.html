<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EngGrowth - 個人スキルマップ</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a1a;
      color: #eee;
      font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー */
    #header {
      background: linear-gradient(135deg, #0a0a2a, #151530);
      border-bottom: 1px solid #2a2a4a;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    #logo { font-size: 1.1rem; font-weight: bold; color: #4a9eff; letter-spacing: 0.1em; }
    #date-display { font-size: 12px; color: #666; margin-left: auto; }

    /* メインコンテンツ */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* 左：入力パネル */
    #input-panel {
      width: 360px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #1a1a3a;
      overflow: hidden;
    }

    /* カテゴリタブ */
    #cat-tabs {
      display: flex;
      background: #0d0d24;
      border-bottom: 1px solid #1a1a3a;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .cat-tab {
      padding: 8px 10px;
      cursor: pointer;
      font-size: 11px;
      color: #666;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .cat-tab.active { color: #4a9eff; border-bottom-color: #4a9eff; }
    .cat-tab:hover { color: #aaa; }

    /* スキルリスト */
    #skill-list { flex: 1; overflow-y: auto; padding: 12px; }
    .skill-item { margin-bottom: 16px; }
    .skill-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .skill-name { font-size: 12px; color: #ccc; }
    .skill-score { font-size: 14px; font-weight: bold; min-width: 24px; text-align: right; }
    .skill-score-label { font-size: 10px; color: #666; margin-left: 4px; }
    input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #1a1a3a;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      cursor: pointer;
    }
    .score-labels {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #333;
      margin-top: 3px;
    }

    /* 保存エリア */
    #save-area {
      padding: 12px;
      border-top: 1px solid #1a1a3a;
      flex-shrink: 0;
    }
    #save-btn {
      width: 100%;
      padding: 10px;
      background: #1a4080;
      border: 1px solid #4a9eff;
      border-radius: 6px;
      color: #4a9eff;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    #save-btn:hover { background: #2a5090; }
    #save-msg { text-align: center; font-size: 11px; color: #4a9eff; margin-top: 6px; height: 16px; }

    /* 右：チャートパネル */
    #chart-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    /* ビュータブ */
    #view-tabs {
      display: flex;
      background: #0d0d24;
      border-bottom: 1px solid #1a1a3a;
      flex-shrink: 0;
    }
    .view-tab {
      padding: 8px 20px;
      cursor: pointer;
      font-size: 12px;
      color: #666;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .view-tab.active { color: #4a9eff; border-bottom-color: #4a9eff; }
    .view-tab:hover { color: #aaa; }

    /* チャートエリア */
    #chart-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 凡例 */
    #legend {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 10px;
      color: #888;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .legend-line { width: 20px; height: 2px; border-radius: 1px; }

    /* 記録パネル */
    #records-panel {
      border-top: 1px solid #1a1a3a;
      padding: 8px 16px;
      max-height: 110px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .records-title { font-size: 10px; color: #555; margin-bottom: 5px; letter-spacing: 0.1em; }
    .record-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 4px;
      border-radius: 4px;
      cursor: pointer;
      border-bottom: 1px solid #0d0d22;
    }
    .record-item:hover { background: #111128; }
    .record-item.selected { background: #111130; }
    .record-date { font-size: 11px; color: #888; min-width: 70px; }
    .record-scores { display: flex; gap: 5px; flex: 1; flex-wrap: wrap; }
    .record-badge { font-size: 10px; padding: 1px 5px; border-radius: 8px; }
    .record-del { font-size: 10px; color: #333; cursor: pointer; padding: 2px 6px; flex-shrink: 0; }
    .record-del:hover { color: #ff4444; }
    .no-records { font-size: 11px; color: #333; padding: 4px 0; }
  </style>
</head>
<body>

<div id="header">
  <div id="logo">📈 EngGrowth</div>
  <div style="font-size:11px;color:#555;">個人スキルマップ</div>
  <div id="date-display"></div>
</div>

<div id="main">
  <div id="input-panel">
    <div id="cat-tabs"></div>
    <div id="skill-list"></div>
    <div id="save-area">
      <button id="save-btn">💾 今日のスキルを記録する</button>
      <div id="save-msg"></div>
    </div>
  </div>

  <div id="chart-panel">
    <div id="view-tabs">
      <div class="view-tab active" data-view="radar">🕸 レーダーチャート</div>
      <div class="view-tab" data-view="trend">📈 成長推移</div>
    </div>
    <div id="chart-area">
      <svg id="radar-svg"></svg>
      <svg id="trend-svg" style="display:none;"></svg>
      <div id="legend"></div>
    </div>
    <div id="records-panel">
      <div class="records-title">📋 記録履歴（クリックで比較）</div>
      <div id="records-list"></div>
    </div>
  </div>
</div>

<script>
// ── スキル定義 ────────────────────────────────
const CATEGORIES = [
  {
    id: "tech",
    label: "技術基盤",
    icon: "🖥",
    color: "#4a9eff",
    items: ["バックエンド開発", "フロントエンド開発", "インフラ・クラウド", "データベース設計", "セキュリティ・認証基盤", "アーキテクチャ設計"]
  },
  {
    id: "process",
    label: "開発プロセス",
    icon: "⚙️",
    color: "#ff9f43",
    items: ["要件定義・仕様整理", "基本・詳細設計", "コードレビュー", "テスト・品質保証", "ドキュメント作成"]
  },
  {
    id: "mgmt",
    label: "EMスキル",
    icon: "👥",
    color: "#ff6b9d",
    items: ["1on1・育成・フィードバック", "採用・オンボーディング", "チームビルディング", "技術戦略・ロードマップ策定", "評価制度・キャリアパス設計"]
  },
  {
    id: "biz",
    label: "ビジネス",
    icon: "💼",
    color: "#26de81",
    items: ["上位折衝・経営連携", "プレゼンテーション・提案力", "ロジカルシンキング", "プロダクト・事業理解"]
  },
  {
    id: "personal",
    label: "個人力",
    icon: "⚡",
    color: "#a55eea",
    items: ["AI活用（Claude Code等）", "トレンドキャッチ・情報収集", "アウトプット・発信", "英語"]
  },
];

const SCORE_LABELS = ["", "入門", "基礎", "実践", "熟練", "エキスパート"];

// ── 状態 ──────────────────────────────────────
let scores = {};
let currentCat = CATEGORIES[0].id;
let currentView = "radar";
let records = JSON.parse(localStorage.getItem("engGrowthRecords") || "[]");
let compareIndex = null;

// 初期スコア
CATEGORIES.forEach(cat => {
  cat.items.forEach((_, i) => { scores[cat.id + "_" + i] = 3; });
});

// ── UI構築 ────────────────────────────────────
function buildTabs() {
  const el = document.getElementById("cat-tabs");
  CATEGORIES.forEach(cat => {
    const tab = document.createElement("div");
    tab.className = "cat-tab" + (cat.id === currentCat ? " active" : "");
    tab.textContent = cat.icon + " " + cat.label;
    tab.addEventListener("click", () => {
      currentCat = cat.id;
      document.querySelectorAll(".cat-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      buildSkillList();
    });
    el.appendChild(tab);
  });
}

function buildSkillList() {
  const listEl = document.getElementById("skill-list");
  listEl.innerHTML = "";
  const cat = CATEGORIES.find(c => c.id === currentCat);

  cat.items.forEach((name, i) => {
    const key = cat.id + "_" + i;
    const score = scores[key];

    const item = document.createElement("div");
    item.className = "skill-item";
    item.innerHTML =
      '<div class="skill-header">'
      + '<span class="skill-name">' + name + '</span>'
      + '<span><span class="skill-score" id="sc-' + key + '" style="color:' + cat.color + '">' + score + '</span>'
      + '<span class="skill-score-label" id="sl-' + key + '">' + SCORE_LABELS[score] + '</span></span>'
      + '</div>'
      + '<input type="range" min="1" max="5" value="' + score + '" id="sl2-' + key + '" style="accent-color:' + cat.color + ';--thumb-color:' + cat.color + '">'
      + '<div class="score-labels"><span>1 入門</span><span>2</span><span>3 実践</span><span>4</span><span>5 エキスパート</span></div>';

    const slider = item.querySelector("#sl2-" + key);
    slider.addEventListener("input", () => {
      const v = parseInt(slider.value);
      scores[key] = v;
      document.getElementById("sc-" + key).textContent = v;
      document.getElementById("sl-" + key).textContent = SCORE_LABELS[v];
      updateChart();
    });

    // スライダーのthumb色をCSSカスタムプロパティで制御
    const style = document.createElement("style");
    style.textContent = "#sl2-" + key + "::-webkit-slider-thumb { background: " + cat.color + "; }";
    document.head.appendChild(style);

    listEl.appendChild(item);
  });
}

// ── スコア計算 ────────────────────────────────
function getCatAvg(catId) {
  const cat = CATEGORIES.find(c => c.id === catId);
  const vals = cat.items.map((_, i) => scores[catId + "_" + i]);
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function getRecordAvgs(rec) {
  return CATEGORIES.map(cat => {
    const vals = cat.items.map((_, i) => rec[cat.id + "_" + i] || 3);
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  });
}

// ── レーダーチャート ──────────────────────────
function drawRadar() {
  const container = document.getElementById("chart-area");
  const W = container.clientWidth;
  const H = container.clientHeight;
  const size = Math.min(W, H, 500);
  const cx = size / 2, cy = size / 2;
  const R = size * 0.33;
  const labelR = R + size * 0.11;
  const n = CATEGORIES.length;
  const slice = (Math.PI * 2) / n;

  const svg = d3.select("#radar-svg").attr("width", size).attr("height", size);
  svg.selectAll("*").remove();

  const rScale = d3.scaleLinear().domain([0, 5]).range([0, R]);

  // グリッド
  for (let lv = 1; lv <= 5; lv++) {
    const pts = CATEGORIES.map((_, j) => {
      const a = slice * j - Math.PI / 2;
      const r = rScale(lv);
      return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    });
    svg.append("polygon")
      .attr("points", pts.map(p => p.join(",")).join(" "))
      .attr("fill", lv % 2 === 0 ? "#0d0d22" : "#0a0a1a")
      .attr("stroke", "#1e1e40").attr("stroke-width", 0.5);

    svg.append("text")
      .attr("x", cx + rScale(lv) * Math.cos(-Math.PI / 2) + 4)
      .attr("y", cy + rScale(lv) * Math.sin(-Math.PI / 2) - 2)
      .attr("fill", "#333").attr("font-size", "9px").text(lv);
  }

  // 軸線とラベル
  CATEGORIES.forEach((cat, j) => {
    const a = slice * j - Math.PI / 2;
    svg.append("line")
      .attr("x1", cx).attr("y1", cy)
      .attr("x2", cx + R * Math.cos(a)).attr("y2", cy + R * Math.sin(a))
      .attr("stroke", "#1e1e40").attr("stroke-width", 1);

    const lx = cx + labelR * Math.cos(a);
    const ly = cy + labelR * Math.sin(a);
    svg.append("text")
      .attr("x", lx).attr("y", ly)
      .attr("text-anchor", "middle").attr("dominant-baseline", "middle")
      .attr("fill", cat.color).attr("font-size", "11px").attr("font-weight", "bold")
      .text(cat.icon + " " + cat.label);
  });

  // 比較記録（破線）
  if (compareIndex !== null && records[compareIndex]) {
    const recAvgs = getRecordAvgs(records[compareIndex].scores);
    const recPts = recAvgs.map((v, j) => {
      const a = slice * j - Math.PI / 2;
      const r = rScale(v);
      return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    });
    svg.append("polygon")
      .attr("points", recPts.map(p => p.join(",")).join(" "))
      .attr("fill", "#ffffff06").attr("stroke", "#ffffff55")
      .attr("stroke-width", 1.5).attr("stroke-dasharray", "5,3");
  }

  // 現在データ
  const avgs = CATEGORIES.map(c => getCatAvg(c.id));
  const dataPts = avgs.map((v, j) => {
    const a = slice * j - Math.PI / 2;
    const r = rScale(v);
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  });

  svg.append("polygon")
    .attr("points", dataPts.map(p => p.join(",")).join(" "))
    .attr("fill", "#4a9eff1a").attr("stroke", "#4a9eff").attr("stroke-width", 2);

  dataPts.forEach((p, j) => {
    const a = slice * j - Math.PI / 2;
    svg.append("circle")
      .attr("cx", p[0]).attr("cy", p[1]).attr("r", 5)
      .attr("fill", CATEGORIES[j].color).attr("stroke", "#0a0a1a").attr("stroke-width", 1.5);

    svg.append("text")
      .attr("x", p[0] + 14 * Math.cos(a)).attr("y", p[1] + 14 * Math.sin(a))
      .attr("text-anchor", "middle").attr("dominant-baseline", "middle")
      .attr("fill", CATEGORIES[j].color).attr("font-size", "11px").attr("font-weight", "bold")
      .text(avgs[j].toFixed(1));
  });

  // 凡例
  const legendEl = document.getElementById("legend");
  let html = '<div class="legend-item"><div class="legend-line" style="background:#4a9eff"></div><span>現在</span></div>';
  if (compareIndex !== null && records[compareIndex]) {
    html += '<div class="legend-item"><div class="legend-line" style="border-top:2px dashed #ffffff55;background:none"></div><span>' + records[compareIndex].date + '</span></div>';
  }
  legendEl.innerHTML = html;
}

// ── 成長推移 ──────────────────────────────────
function drawTrend() {
  const container = document.getElementById("chart-area");
  const W = container.clientWidth - 20;
  const H = container.clientHeight - 20;

  const svg = d3.select("#trend-svg").attr("width", W).attr("height", H);
  svg.selectAll("*").remove();

  if (records.length < 2) {
    svg.append("text")
      .attr("x", W / 2).attr("y", H / 2)
      .attr("text-anchor", "middle").attr("fill", "#444").attr("font-size", "13px")
      .text("記録が2件以上になると推移グラフが表示されます");
    return;
  }

  const mg = { top: 20, right: 100, bottom: 36, left: 36 };
  const iW = W - mg.left - mg.right;
  const iH = H - mg.top - mg.bottom;
  const g = svg.append("g").attr("transform", "translate(" + mg.left + "," + mg.top + ")");

  const dates = records.map(r => r.date);
  const xScale = d3.scalePoint().domain(dates).range([0, iW]).padding(0.3);
  const yScale = d3.scaleLinear().domain([0.5, 5.5]).range([iH, 0]);

  // グリッド
  for (let i = 1; i <= 5; i++) {
    g.append("line")
      .attr("x1", 0).attr("y1", yScale(i)).attr("x2", iW).attr("y2", yScale(i))
      .attr("stroke", "#1e1e40").attr("stroke-width", 0.5);
    g.append("text")
      .attr("x", -6).attr("y", yScale(i)).attr("dominant-baseline", "middle")
      .attr("text-anchor", "end").attr("fill", "#444").attr("font-size", "9px").text(i);
  }

  // X軸
  g.append("g").attr("transform", "translate(0," + iH + ")")
    .call(d3.axisBottom(xScale).tickSize(0))
    .selectAll("text").attr("fill", "#666").attr("font-size", "10px").attr("dy", "1.2em");
  g.selectAll(".domain").attr("stroke", "#333");
  g.selectAll(".tick line").remove();

  // 折れ線
  CATEGORIES.forEach(cat => {
    const lineData = records.map(r => ({
      date: r.date,
      avg: cat.items.map((_, i) => r.scores[cat.id + "_" + i] || 3).reduce((a, b) => a + b, 0) / cat.items.length
    }));

    const line = d3.line().x(d => xScale(d.date)).y(d => yScale(d.avg)).curve(d3.curveMonotoneX);

    g.append("path").datum(lineData)
      .attr("fill", "none").attr("stroke", cat.color).attr("stroke-width", 2).attr("d", line);

    lineData.forEach(d => {
      g.append("circle")
        .attr("cx", xScale(d.date)).attr("cy", yScale(d.avg)).attr("r", 4)
        .attr("fill", cat.color).attr("stroke", "#0a0a1a").attr("stroke-width", 1.5);
    });

    const last = lineData[lineData.length - 1];
    g.append("text")
      .attr("x", xScale(last.date) + 8).attr("y", yScale(last.avg))
      .attr("dominant-baseline", "middle")
      .attr("fill", cat.color).attr("font-size", "10px")
      .text(cat.icon + " " + last.avg.toFixed(1));
  });
}

// ── 更新 ──────────────────────────────────────
function updateChart() {
  if (currentView === "radar") drawRadar();
  else drawTrend();
}

// ── 記録リスト ────────────────────────────────
function renderRecords() {
  const listEl = document.getElementById("records-list");
  listEl.innerHTML = "";

  if (records.length === 0) {
    listEl.innerHTML = '<div class="no-records">まだ記録がありません</div>';
    return;
  }

  [...records].reverse().forEach((rec, revIdx) => {
    const idx = records.length - 1 - revIdx;
    const avgs = getRecordAvgs(rec.scores);

    const item = document.createElement("div");
    item.className = "record-item" + (compareIndex === idx ? " selected" : "");

    const badges = CATEGORIES.map((cat, i) =>
      '<span class="record-badge" style="background:' + cat.color + '22;color:' + cat.color + '">'
      + cat.icon + avgs[i].toFixed(1) + '</span>'
    ).join("");

    item.innerHTML =
      '<div class="record-date">' + rec.date + '</div>'
      + '<div class="record-scores">' + badges + '</div>'
      + '<div class="record-del" title="削除">✕</div>';

    item.addEventListener("click", e => {
      if (e.target.classList.contains("record-del")) return;
      compareIndex = compareIndex === idx ? null : idx;
      renderRecords();
      updateChart();
    });

    item.querySelector(".record-del").addEventListener("click", () => {
      if (!confirm("この記録を削除しますか？")) return;
      records.splice(idx, 1);
      if (compareIndex === idx) compareIndex = null;
      else if (compareIndex !== null && compareIndex > idx) compareIndex--;
      saveRecords();
      renderRecords();
      updateChart();
    });

    listEl.appendChild(item);
  });
}

// ── 保存 ──────────────────────────────────────
function saveRecords() {
  localStorage.setItem("engGrowthRecords", JSON.stringify(records));
}

document.getElementById("save-btn").addEventListener("click", () => {
  const now = new Date();
  const date = now.getFullYear() + "/"
    + String(now.getMonth() + 1).padStart(2, "0") + "/"
    + String(now.getDate()).padStart(2, "0");

  const existing = records.findIndex(r => r.date === date);
  const rec = { date, scores: { ...scores } };
  if (existing >= 0) records[existing] = rec;
  else records.push(rec);

  saveRecords();
  renderRecords();
  updateChart();

  const msg = document.getElementById("save-msg");
  msg.textContent = "✓ " + date + " に記録しました";
  setTimeout(() => { msg.textContent = ""; }, 3000);
});

// ── ビュー切り替え ────────────────────────────
document.querySelectorAll(".view-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    currentView = tab.dataset.view;
    document.querySelectorAll(".view-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("radar-svg").style.display = currentView === "radar" ? "block" : "none";
    document.getElementById("trend-svg").style.display = currentView === "trend" ? "block" : "none";
    document.getElementById("legend").style.display = currentView === "radar" ? "block" : "none";
    updateChart();
  });
});

// ── 日付 ──────────────────────────────────────
(function() {
  const now = new Date();
  const days = ["日","月","火","水","木","金","土"];
  document.getElementById("date-display").textContent =
    now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日（" + days[now.getDay()] + "）";
})();

// ── 初期化 ────────────────────────────────────
buildTabs();
buildSkillList();
renderRecords();
updateChart();
window.addEventListener("resize", updateChart);
</script>
</body>
